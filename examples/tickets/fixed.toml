# The same shop, with FOR UPDATE on the read. Every order passes.
# There is no setup SQL: racetrap saves the tables and puts them back itself.

app = "http://127.0.0.1:8765"
database = "${DATABASE_URL}"
command = "python -m uvicorn app:app --port 8765 --log-level warning"

init = [
    "DROP TABLE IF EXISTS bookings, shows",
    "CREATE TABLE shows (id int PRIMARY KEY, title text NOT NULL, seats_left int NOT NULL)",
    "CREATE TABLE bookings (id serial PRIMARY KEY, show_id int NOT NULL REFERENCES shows, user_name text NOT NULL)",
    "INSERT INTO shows VALUES (1, 'Dune', 1)",
]

[[request]]
name = "alice books"
path = "/shows/1/book-locked"
json = { user = "alice" }

[[request]]
name = "bob books"
path = "/shows/1/book-locked"
json = { user = "bob" }
