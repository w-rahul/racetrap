name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync
      - run: uv run ruff check

  linux:
    name: Postgres ${{ matrix.postgres }}, Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { postgres: "14", python: "3.11" }
          - { postgres: "15", python: "3.12" }
          - { postgres: "16", python: "3.12" }
          - { postgres: "17", python: "3.13" }
          - { postgres: "18", python: "3.14" }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 30
    env:
      RACETRAP_TEST_DATABASE: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest -q --cov=racetrap --cov-report=term --cov-fail-under=88

  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ikalnytskyi/action-setup-postgres@v9
        id: postgres
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --python 3.13
      - run: uv run pytest -q
        env:
          RACETRAP_TEST_DATABASE: ${{ steps.postgres.outputs.connection-uri }}
